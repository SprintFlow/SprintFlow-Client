<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Degradado vibrante tipo Instagram -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4db8a8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a9d8f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con degradado vibrante -->
  <rect width="100" height="100" fill="url(#bgGradient)" rx="20"/>
  
  <!-- Canal en forma de S con línea blanca muy prominente -->
  <path
    d="M80,20 
       L30,20
       C20,20 15,25 15,32
       C15,39 20,44 30,44
       L70,44
       C80,44 85,49 85,56
       C85,63 80,68 70,68
       L30,68
       C20,68 15,73 15,80
       C15,87 20,92 30,92
       L80,92"
    stroke="white"
    strokeWidth="26"
    fill="none"
    strokeLinecap="round"
    strokeLinejoin="round"
  />
  
  <!-- Bolitas amarillas brillantes -->
  <circle cx="80" cy="20" r="7" fill="#fcd34d"/>
  <circle cx="30" cy="44" r="7" fill="#fcd34d"/>
  <circle cx="70" cy="68" r="7" fill="#fcd34d"/>
</svg>